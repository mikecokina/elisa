language: python

jobs:
  include:
    - name: "Python 3.11 on Windows"
      os: windows
      language: shell
      before_install:
        - choco install python --version 3.11.9
        - python -m pip install --upgrade pip
      env:
        - PATH=/c/Python311:/c/Python311/Scripts:$PATH
        - ELISA_CONFIG=/c/Users/travis/AppData/Local/Temp/elisa.ini
    - name: "Python 3.11 on Ubuntu"
      python: "3.11"
      env: ELISA_CONFIG=/tmp/elisa.ini

install:
  - python -m pip install -r requirements.txt
  - python -m pip install .[test]

script:
  - python -m pytest tests -s

notifications:
  email:
    recipients:
      - mikecokina@gmail.com
      - mirofedurco@gmail.com
    on_success: always
    on_failure: always

branches:
  only:
  - master
  - dev
  - /^release.*$/
  - pulsations

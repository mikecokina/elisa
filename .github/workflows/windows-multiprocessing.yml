name: Windows multiprocessing

on:
  push:
    branches: [fix/windows-spawn-pr28]
  pull_request:
    branches: [dev, feature/optimizations]

permissions:
  contents: read

jobs:
  multiprocessing:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.12'
          - os: windows-latest
            python: '3.14'
          - os: ubuntu-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      ELISA_CONFIG: ${{ github.workspace }}/.ci/elisa.ini
      MPLBACKEND: Agg
      NUMBA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare noninteractive configuration
        shell: python
        run: |
          import os
          from pathlib import Path
          config = Path(os.environ['ELISA_CONFIG'])
          config.parent.mkdir(parents=True, exist_ok=True)
          home = Path(os.environ['RUNNER_TEMP']) / 'elisa data'
          home.mkdir(parents=True, exist_ok=True)
          config.write_text(f'[general]\nhome={home}\nsuppress_warnings=true\n')
      - name: Install package and test dependencies
        run: python -m pip install -e . pytest ruff
      - name: Check changed production modules
        run: >-
          python -m ruff check
          src/elisa/observer/mp_manager.py
          src/elisa/analytics/binary_fit/mcmc.py
          src/elisa/analytics/binary_fit/mcmc_diagnostics.py
          src/elisa/analytics/binary_fit/summary.py
      - name: Test imports, worker state, physical curves, and MCMC diagnostics
        run: >-
          python -m pytest -q
          tests/test_computational/test_mp_manager.py
          tests/test_computational/test_spawn.py
          tests/tests_analytics/test_mcmc_diagnostics_integration.py

  scientific-suite:
    name: Scientific suite (${{ matrix.revision }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        revision: [candidate, pr28]
    env:
      ELISA_CONFIG: ${{ github.workspace }}/.ci/elisa.ini
      MPLBACKEND: Agg
      NUMBA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision == 'pr28' && 'a56fa8e5161ed1e2cdc3e67a5d44a549c4e48a30' || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare noninteractive configuration
        shell: python
        run: |
          import os
          from pathlib import Path
          config = Path(os.environ['ELISA_CONFIG'])
          config.parent.mkdir(parents=True, exist_ok=True)
          home = Path.home() / '.elisa'
          home.mkdir(parents=True, exist_ok=True)
          config.write_text(f'[general]\nhome={home}\nsuppress_warnings=true\n')
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test,ui]"
      - name: Install published limb-darkening tables
        run: python -c "from elisa import settings; from elisa.managers.download_manager import DownloadManager; DownloadManager(settings).download_van_hamme()"
      - name: Run scientific test suite
        run: python -m pytest tests --ignore=tests/tests_gui -q -ra --junitxml=.ci/scientific-tests.xml
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scientific-tests-${{ matrix.revision }}
          path: .ci/scientific-tests.xml

; Example configuration: Sutherland-Hodgman intersection area calculation.
[computational]
; Emergency candidate-only rejection of all ordinary exceptions; may mask configuration or implementation errors.
penalize_all_exceptions = false
; Kepler secant solver: vectorized (default) or scalar
mean_anomaly_solver = vectorized

; Available backends: pypex, reference, sutherland_hodgman
intersection_backend = sutherland_hodgman
mcmc_autocorr_tol = 0

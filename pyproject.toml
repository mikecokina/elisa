[build-system]
requires = ["setuptools>=82.0.0", "wheel>=0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "elisa"
dynamic = ["version"]
description = "Eclipsing Binary Modeling Software"
readme = { file = "README.rst", content-type = "text/x-rst" }
requires-python = ">=3.10"
license = { text = "GPLv3" }
authors = [
    { name = "Michal Cokina", email = "mikecokina@gmail.com" },
    { name = "Miroslav Fedurco", email = "mirofedurco@gmail.com" },
]
keywords = ["eclipsing binaries", "astronomy", "analysis", "analytics", "physic"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Astronomy",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    # Python 3.10 compatible floors
    'astropy>=6.1.7; python_version < "3.11"',
    'numpy>=2.2.0; python_version < "3.11"',
    'pandas>=2.2.3; python_version < "3.11"',
    'scipy>=1.15.0; python_version < "3.11"',
    # Python 3.11+ floors
    'astropy>=7.2.0; python_version >= "3.11"',
    'numpy>=2.4.2; python_version >= "3.11"',
    'pandas>=3.0.1; python_version >= "3.11"',
    'scipy>=1.17.1; python_version >= "3.11"',
    # Common deps
    "corner>=2.2.1",
    "emcee>=3.0.1",
    "jsonschema>=3.2.0",
    "matplotlib>=3.3.2",
    "packaging>=20.0",
    "python-dateutil>=2.6.1",
    "tqdm>=4.43.0",
    "parameterized>=0.7.4",
    "numba>=0.51.2",
    "requests>=2.26.0",
]

[project.optional-dependencies]
dev = [
    "setuptools>=82.0.0",
    "wheel>=0.46.3",
    "build",
    "twine",
]
test = [
    "coverage",
    "pytest>=9.0.2",
    "parameterized>=0.7.4",
]

[project.urls]
Homepage = "https://github.com/mikecokina/elisa"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
elisa = [
    "passband/**",
    "conf/**",
    "schema_registry/**",
    "data/**",
]

[tool.setuptools.dynamic]
# This expects `__version__ = "x.y.z"` in src/elisa/__init__.py
version = { attr = "elisa.__version__" }